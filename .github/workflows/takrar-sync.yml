name: Takrar Daily Sync

# مبيعات اشتراكات تكرار → الموقع (فرع «تكرار»). كل يوم الساعة ١١:٢٠ مساءً بتوقيت الرياض.
# الإعدادات بسر TAKRAR_CONFIG_JSON: توكن API (قراءة بس) — الدخول بالمتصفح انلغى لأنه صار OTP.
# المستودع عام: السجل ما فيه أرقام مبيعات ولا بيانات عملاء.
on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:
    inputs:
      explore:
        description: "docs = print Takrar public API docs index; probe = try TAKRAR paths (status + field names only)"
        required: false
        default: ""
      path:
        description: "probe: comma-separated API paths"
        required: false
        default: ""

jobs:
  takrar-sync:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Takrar API
        working-directory: ./takrar-sync
        env:
          TAKRAR_CONFIG: ${{ secrets.TAKRAR_CONFIG_JSON }}
          TAKRAR_EXPLORE: ${{ github.event.inputs.explore }}
          TAKRAR_PATH: ${{ github.event.inputs.path }}
        run: node takrar-api.js
