# فحص تلقائي لكل تعديل قبل ما يوصل للموظفين: صياغة الملفات، دوال التاريخ، ورقم النسخة،
# وبعدين يفتح التطبيق بوضع التجربة ويمر على كل الشاشات. ما فيه أسرار ولا بيانات حقيقية.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: node tests/unit.js
      - name: Install browser
        run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Smoke test (demo mode)
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          node tests/smoke.js
