name: ALJ Daily Reports

# تقريرين عبداللطيف جميل اليوميين من تابسنس (ملخص PDF + طلبات Excel). الملخص زي ما هو؛ الطلبات: نشيل
# الفواتير بدون رقم ونضيف سطر مجموع محسوب من الفواتير (مطابق للملخص).
# كل يوم ٦:١٥ مساءً بتوقيت الرياض (بعد إغلاق الفرع)، وتقدر تشغّله يدوي لأيام قديمة.
# المستودع عام: الملفات تروح للمخزن الخاص بالموقع بس — ما تنرفع كـ artifacts وما تنطبع أرقام.
# وبعدين تنرسل بالإيميل لعبداللطيف جميل (أيام الدوام بس) — المستلمين بإعدادات الموقع، كلمة المرور سر GMAIL_APP_PASSWORD.
on:
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      start:
        description: "From date YYYY-MM-DD (empty = today)"
        required: false
        default: ""
      end:
        description: "To date YYYY-MM-DD (empty = same as start)"
        required: false
        default: ""
      send:
        description: "Email the reports to ALJ"
        type: boolean
        default: false
      test:
        description: "Test: email only to our own sender address"
        type: boolean
        default: false

jobs:
  alj-reports:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ./tabsense-sync
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          # بايثون النظام (السكربتات تشتغل بـ python3 -I اللي يتجاهل مكتبات المستخدم)
          sudo python3 -m pip install --quiet --break-system-packages pymupdf
      - name: Create config.json from GitHub Secret
        working-directory: ./tabsense-sync
        env:
          TABSENSE_CONFIG: ${{ secrets.TABSENSE_CONFIG_JSON }}
        run: |
          if [ -z "$TABSENSE_CONFIG" ]; then echo "TABSENSE_CONFIG_JSON secret is not set"; exit 1; fi
          echo "$TABSENSE_CONFIG" > config.json
      - name: Download and store ALJ reports
        working-directory: ./tabsense-sync
        env:
          ALJ_START: ${{ github.event.inputs.start }}
          ALJ_END: ${{ github.event.inputs.end }}
          # التشغيل اليومي يرسل دايماً؛ اليدوي بس إذا اخترت send أو test
          ALJ_SEND: ${{ (github.event_name == 'schedule' || github.event.inputs.send == 'true' || github.event.inputs.test == 'true') && '1' || '' }}
          ALJ_MAIL_TEST: ${{ github.event.inputs.test == 'true' && '1' || '' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node alj-run.js
